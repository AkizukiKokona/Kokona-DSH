appId: com.kokona.dsh
productName: Kokona DSH
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asar: true
artifactName: KokonaDSH-${version}-${os}-${arch}.${ext}
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: KokonaDSH-Setup-${version}.${ext}
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: resources/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
